name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ESLint + eslint-plugin-cypress)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: 0
      - run: npx eslint . --max-warnings 100

  e2e:
    name: E2E · ${{ matrix.browser }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox, edge, electron]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Cypress run (${{ matrix.browser }})
        id: cy
        uses: cypress-io/github-action@v7.4.9
        continue-on-error: true
        with:
          browser: ${{ matrix.browser }}
          start: npm start
          wait-on: http://localhost:8080
          wait-on-timeout: 60
      - name: Aggregate results
        if: always()
        run: node tools/aggregate.js --browser ${{ matrix.browser }}
      - name: Job summary
        if: always()
        run: node tools/summary.js reports/results-${{ matrix.browser }}.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: evidence-${{ matrix.browser }}
          path: |
            reports/
            cypress/videos/
            cypress/screenshots/
            cypress/snapshots/
          retention-days: 30
      - name: Gate — no unexpected failures
        if: always()
        run: node tools/aggregate.js --browser ${{ matrix.browser }} --strict

  coverage:
    name: Code coverage of the app's JavaScript (Chrome)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: cypress-io/github-action@v7.4.9
        continue-on-error: true
        with:
          browser: chrome
          start: npm run start:coverage
          wait-on: http://localhost:8080
          expose: coverage=true
      - name: Coverage report
        if: always()
        run: npx nyc report --reporter=json-summary --reporter=json --reporter=text --reporter=html --report-dir reports/coverage
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: coverage
          path: reports/coverage/

  publish:
    name: Publish evidence to the results branch
    needs: [e2e, coverage]
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
      - name: Commit evidence
        run: bash tools/publish-results.sh "${{ github.sha }}" "${{ github.run_id }}"
