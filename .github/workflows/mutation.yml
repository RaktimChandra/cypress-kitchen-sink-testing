name: Mutation testing

# Fault injection into the application under test: are the tests strong enough to notice?
on:
  push:
    branches: [main]
    paths: [tools/mutants.js, tools/mutation.js, 'cypress/e2e/**', 'cypress/support/**', .github/workflows/mutation.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutants:
    name: Mutants shard ${{ matrix.shard }}/4
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx cypress verify
      - name: Run mutants
        run: node tools/mutation.js
        env:
          SHARD: ${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: mutation-${{ matrix.shard }}
          path: reports/mutation/

  publish:
    needs: mutants
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
      - run: bash tools/publish-results.sh "${{ github.sha }}" "${{ github.run_id }}" mutation
